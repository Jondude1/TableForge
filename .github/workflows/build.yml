name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Check database migrations
        run: python3 scripts/check_migrations.py

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TableForge-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TableForge-apk
          path: TableForge-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TableForge v1.0.${{ github.run_number }}
          body: Install TableForge-v1.0.${{ github.run_number }}.apk on the tablet (allow installs from unknown sources).
          files: TableForge-*.apk
          make_latest: true
